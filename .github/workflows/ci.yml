name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      include-course:
        description: Bundle the pinned private course resources for authorized testers
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    uses: ./.github/workflows/app-build.yml
    with:
      include-course: ${{ github.event_name == 'workflow_dispatch' && inputs.include-course || false }}
