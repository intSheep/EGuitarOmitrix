name: Draft application release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag on main; creates a draft release only
        required: true
        type: string
      include-course:
        description: Include the pinned course pack for public distribution
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: draft-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - run: npm run release:check -- "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ inputs.tag }}
  build:
    needs: validate
    uses: ./.github/workflows/app-build.yml
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    with:
      release-build: true
      ref: ${{ inputs.tag }}
      retention-days: 1
      include-course: ${{ inputs.include-course }}
  draft:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: windows-*
          path: artifacts/windows
          merge-multiple: true
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: android-*
          path: artifacts/android
          merge-multiple: true
      - name: Prepare release notes
        run: |
          cat > notes.md <<'EOF'
          帅帅练琴屋 — public pilot. Windows installer is unsigned; Android APK uses the stable project release key.

          Export a practice backup before upgrading. Earlier Android debug builds may require backup/uninstall/import for the first release-key installation. Later release builds retain the signing identity.

          See each platform manifest's courseResources field for the bundled course version, item count and checksums. A null courseResources field identifies a lightweight package. Original course videos, preparation intermediates and learner records are excluded. Bundling preserves existing notation/review status; it does not certify musical accuracy or backing-track synchronization. Browser, desktop and phone profiles are separate; use backup export/import for transfer. No cloud sync. Windows: 帮助 → 检查更新, with explicit download/install confirmation. Versions before 0.4.0 need one manual upgrade. Android: download/install the newer APK.

          Thanks to 「帅帅是把电吉他」老师: https://www.bilibili.com/video/BV1FT411Z7iu/ . Independent companion, not an official teacher product.

          See platform manifests for source commit, version and SHA-256 checksums. Native device/audio acceptance remains required before publishing. This workflow creates a draft release; publication is manual.
          EOF
      - name: Create public draft release
        run: gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "帅帅练琴屋 $RELEASE_TAG" --notes-file notes.md artifacts/windows/* artifacts/android/*
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
